@<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת יומית | אורט בית הערבה תשפ"ו</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --p:    #0E7490;
      --p2:   #0891B2;
      --s:    #14B8A6;
      --a:    #34D399;
      --dark: #093545;
      --bg:   #F0FDFA;
      --text: #1A2E35;
      --muted:#6B7F87;
      --border:#DCE9EB;
      --sh:   0 2px 16px rgba(14,116,144,.10);
      --shlg: 0 6px 32px rgba(14,116,144,.18);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      direction: rtl;
      min-height: 100vh;
    }

    /* ─── HEADER ──────────────────────────── */
    header {
      background: linear-gradient(130deg, var(--dark) 0%, var(--p) 55%, var(--s) 100%);
      color: #fff;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shlg);
    }
    .hd-brand { display:flex; align-items:center; gap:.9rem; }
    .hd-logo {
      width:46px; height:46px;
      background: rgba(255,255,255,.16);
      border: 1.5px solid rgba(255,255,255,.3);
      border-radius: 13px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Rubik', sans-serif; font-weight:900; font-size:.95rem;
      letter-spacing:-.5px; backdrop-filter: blur(10px);
    }
    .hd-title { font-family:'Rubik', sans-serif; font-size:1.1rem; font-weight:700; }
    .hd-sub   { font-size:.72rem; opacity:.75; margin-top:2px; }
    .hd-clock { text-align:center; }
    #clock {
      font-family:'Rubik', sans-serif; font-size:2.1rem; font-weight:800;
      letter-spacing:3px; line-height:1;
      text-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    #clock-date { font-size:.72rem; opacity:.75; margin-top:3px; }
    .hd-right  { text-align:left; min-width:160px; }
    #period-chip {
      background: rgba(255,255,255,.16); border: 1.5px solid rgba(255,255,255,.28);
      border-radius: 11px; padding: .45rem .9rem;
      font-size:.82rem; font-weight:600; display:inline-block;
      backdrop-filter: blur(8px);
    }

    /* ─── MAIN ────────────────────────────── */
    .main { max-width:1380px; margin:0 auto; padding:1.4rem 2rem; }

    /* ─── DAY TABS ────────────────────────── */
    .day-tabs-wrap {
      background:#fff; border-radius:14px; padding:4px;
      display:flex; gap:3px; margin-bottom:1rem;
      box-shadow: var(--sh);
    }
    .day-tab {
      flex:1; border:none; background:transparent; border-radius:10px;
      padding:.55rem .4rem .45rem;
      font-family:'Heebo', sans-serif; font-weight:600; font-size:.9rem;
      cursor:pointer; color:var(--muted); transition: all .22s;
      display:flex; flex-direction:column; align-items:center; gap:1px;
    }
    .day-tab-sub { font-size:.68rem; font-weight:400; opacity:.65; }
    .day-tab.active {
      background: linear-gradient(135deg, var(--p), var(--s));
      color:#fff; box-shadow: 0 3px 12px rgba(14,116,144,.35);
    }
    .day-tab.active .day-tab-sub { opacity:.85; }
    .today-dot { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--a); margin-bottom:2px; }
    .day-tab.active .today-dot { background:#fff; }

    /* ─── CLASS TABS ──────────────────────── */
    .class-bar {
      background:#fff; border-radius:14px; padding:.5rem .6rem;
      display:flex; gap:.4rem; flex-wrap:wrap;
      margin-bottom:1.3rem; box-shadow: var(--sh);
      align-items:center;
    }
    .class-label {
      font-size:.78rem; font-weight:700; color:var(--muted);
      padding:.2rem .5rem; white-space:nowrap;
    }
    .class-btn {
      border:1.5px solid var(--border); border-radius:9px;
      background:#fff; padding:.38rem .75rem;
      font-family:'Rubik', sans-serif; font-weight:700; font-size:.88rem;
      cursor:pointer; color:var(--muted); transition: all .2s;
    }
    .class-btn:hover { border-color:var(--s); color:var(--p); background:#EFF9F8; }
    .class-btn.active {
      background: linear-gradient(135deg, var(--p), var(--s));
      color:#fff; border-color:transparent;
      box-shadow: 0 3px 10px rgba(14,116,144,.3);
    }

    /* ─── GRID ────────────────────────────── */
    .grid { display:grid; grid-template-columns:1fr 290px; gap:1.3rem; align-items:start; }
    @media(max-width:880px){ .grid{ grid-template-columns:1fr; } }

    /* ─── LESSON CARDS ────────────────────── */
    .lessons-wrap { display:flex; flex-direction:column; gap:1rem; }

    .lesson-card {
      background:#fff; border-radius:18px; box-shadow: var(--sh);
      display:flex; align-items:stretch; overflow:hidden;
      animation: fadeUp .35s ease both;
      border: 1.5px solid transparent;
      transition: box-shadow .2s, transform .2s;
    }
    .lesson-card:hover { box-shadow: var(--shlg); transform:translateY(-2px); }
    .lesson-card:nth-child(2){ animation-delay:.07s; }
    .lesson-card:nth-child(3){ animation-delay:.14s; }

    /* Left accent stripe */
    .lesson-stripe {
      width:6px; flex-shrink:0;
      background: linear-gradient(180deg, var(--p), var(--s));
    }

    /* Time box */
    .lesson-time {
      background: linear-gradient(135deg, rgba(14,116,144,.06), rgba(20,184,166,.08));
      border-left: 1px solid var(--border);
      padding:1.2rem 1rem;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-width:100px; flex-shrink:0; text-align:center;
    }
    .lesson-time .tl { font-size:.6rem; font-weight:800; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; margin-bottom:.25rem; }
    .lesson-time .tm { font-family:'Rubik', sans-serif; font-weight:800; font-size:1rem; color:var(--p); line-height:1.4; }

    /* Main content */
    .lesson-body {
      flex:1; padding:1rem 1.2rem;
      display:flex; align-items:center; justify-content:space-between;
      gap:1rem; flex-wrap:wrap;
    }
    .lesson-subject {
      font-family:'Rubik', sans-serif; font-size:1.45rem; font-weight:900; color:var(--text);
    }

    /* Teacher section */
    .lesson-right { display:flex; gap:.75rem; flex-wrap:wrap; align-items:flex-end; }

    .teacher-box {
      background:#F6FEFE; border:1.5px solid var(--border);
      border-radius:14px; padding:.8rem 1rem;
      min-width:170px; display:flex; flex-direction:column; gap:.5rem;
    }
    .teacher-track {
      font-size:.62rem; font-weight:800; color:var(--p);
      text-transform:uppercase; letter-spacing:.4px;
    }
    .teacher-name-lbl {
      font-size:.85rem; font-weight:700; color:var(--text);
    }
    .btn-row { display:flex; flex-direction:column; gap:.35rem; }

    .lc-btn {
      display:flex; align-items:center; justify-content:center; gap:.4rem;
      padding:.42rem .7rem; border-radius:9px;
      font-family:'Heebo', sans-serif; font-size:.78rem; font-weight:700;
      text-decoration:none; border:none; cursor:pointer;
      transition: all .18s;
    }
    .lc-btn.zoom   { background:#EFF6FF; color:#2563EB; }
    .lc-btn.zoom:hover  { background:#2563EB; color:#fff; }
    .lc-btn.meet   { background:#F0FDF4; color:#00897B; }
    .lc-btn.meet:hover  { background:#00897B; color:#fff; }
    .lc-btn.no-lnk { background:#F1F5F9; color:#94A3B8; cursor:not-allowed; }
    .lc-btn.task   { background:rgba(20,184,166,.12); color:var(--s2); }
    .lc-btn.task:hover  { background:var(--s); color:#fff; }
    .lc-btn.task2  { background:rgba(52,211,153,.15); color:#059669; }
    .lc-btn.task2:hover { background:#059669; color:#fff; }
    .lc-btn.no-task { background:#F8FAFC; color:#CBD5E1; cursor:not-allowed; }

    /* Empty state */
    .no-schedule {
      background:#fff; border-radius:18px; box-shadow: var(--sh);
      padding:3rem; text-align:center; color:var(--muted);
      font-size:1rem;
    }
    .no-schedule .icon { font-size:2.5rem; margin-bottom:.8rem; }

    /* ─── CARD (sidebar) ──────────────────── */
    .card { background:#fff; border-radius:18px; box-shadow: var(--sh); overflow:hidden; animation: fadeUp .4s ease both; }
    .card-hd { background:linear-gradient(135deg,var(--p),var(--s)); color:#fff; padding:.9rem 1.2rem; }
    .card-hd-title { font-family:'Rubik', sans-serif; font-weight:700; font-size:.95rem; }

    /* ─── SIDEBAR ─────────────────────────── */
    .sidebar { display:flex; flex-direction:column; gap:1.1rem; }

    /* Teacher directory */
    .teacher-list { padding:5px; max-height:360px; overflow-y:auto; }
    .t-row { display:flex; align-items:center; justify-content:space-between; padding:.52rem .65rem; border-radius:10px; transition:background .15s; }
    .t-row:hover { background:#EDF9F8; }
    .t-name { font-size:.87rem; font-weight:600; }
    .t-link { display:inline-flex; align-items:center; gap:.2rem; text-decoration:none; font-size:.74rem; font-weight:700; padding:.23rem .6rem; border-radius:7px; transition:all .18s; }
    .t-link.zoom { background:rgba(45,140,255,.1); color:#2D8CFF; }
    .t-link.zoom:hover { background:#2D8CFF; color:#fff; }
    .t-link.meet { background:rgba(0,137,123,.1); color:#00897B; }
    .t-link.meet:hover { background:#00897B; color:#fff; }
    .t-no-link { font-size:.72rem; color:#C8D6D8; }

    /* Tasks */
    .tasks-inner { padding:6px; }
    .tasks-scroll { max-height:210px; overflow-y:auto; margin-bottom:.4rem; }
    .task-row { display:flex; align-items:flex-start; gap:.45rem; padding:.52rem .6rem; border-radius:9px; border:1.5px solid #EFF4F5; margin-bottom:4px; transition:border-color .18s; background:#fff; }
    .task-row:hover { border-color:#B2E8E2; }
    .task-chk { width:17px; height:17px; flex-shrink:0; border-radius:5px; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.6rem; transition:all .18s; margin-top:2px; }
    .task-chk.on { background:var(--s); border-color:var(--s); color:#fff; }
    .task-txt { flex:1; font-size:.84rem; line-height:1.4; word-break:break-word; }
    .task-txt.done { text-decoration:line-through; color:var(--muted); }
    .task-x { background:none; border:none; color:#D0DCDE; font-size:.88rem; cursor:pointer; padding:0; transition:color .18s; flex-shrink:0; }
    .task-x:hover { color:#EF4444; }
    .no-tasks { text-align:center; color:#C0CDD0; font-size:.8rem; padding:1rem; }
    .task-add { display:flex; gap:5px; padding-top:.5rem; border-top:1px solid #EFF4F5; }
    .task-inp { flex:1; border:1.5px solid var(--border); border-radius:9px; padding:.44rem .65rem; font-family:'Heebo', sans-serif; font-size:.82rem; direction:rtl; outline:none; transition:border-color .18s; }
    .task-inp:focus { border-color:var(--s); }
    .task-add-btn { background:linear-gradient(135deg,var(--p),var(--s)); border:none; border-radius:9px; width:34px; height:34px; color:#fff; font-size:1.2rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:opacity .18s; }
    .task-add-btn:hover { opacity:.85; }

    /* ─── ANIMS ───────────────────────────── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    /* ─── SCROLLBAR ───────────────────────── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#B8CCCE; border-radius:4px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--s); }

    /* ─── RESPONSIVE ──────────────────────── */
    @media(max-width:640px){
      header { height:auto; padding:.8rem 1rem; flex-wrap:wrap; gap:.6rem; }
      .main  { padding:1rem; }
      #clock { font-size:1.6rem; }
      .lesson-body { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header>
  <div class="hd-brand">
    <div class="hd-logo">אורט</div>
    <div>
      <div class="hd-title">אורט בית הערבה</div>
      <div class="hd-sub">מערכת יומית – תשפ"ו</div>
    </div>
  </div>
  <div class="hd-clock">
    <div id="clock">00:00:00</div>

  <div class="hd-right">

</header>

<!-- ══════════ MAIN ══════════ -->
<div class="main">

        <div class="teacher-list" id="teacher-dir"></div>
      </div>

      <div class="card" style="animation-delay:.2s">
        <div class="card-hd"><span class="card-hd-title">📋 מטלות ומשימות</span></div>
        <div class="tasks-inner">
          <div class="tasks-scroll" id="tasks-list"></div>
          <div class="task-add">
            <input class="task-inp" id="task-inp" type="text" placeholder="הוסף מטלה חדשה..." />
            <button class="task-add-btn" onclick="addTask()">+</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

// Helper to find teacher by name (handles partial match for 'נעמה' → 'נעמה קוסטן')
function findTeacher(name) {
  if (!name) return null;
  return TEACHERS.find(t => t.name === name)
      || TEACHERS.find(t => t.name.startsWith(name) || name.startsWith(t.name.split(' ')[0]));
}

const CLASSES  = ['ט1','ט2','י1','י2','י3','יא1','יא2','יא3','יב1','יב2','יב3'];
const DAYS     = ['ראשון','שני','שלישי','רביעי','חמישי'];
const DAYS_SUB = ["א'","ב'","ג'","ד'","ה'"];
const HEB_DAYS   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

// ════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════
let currentDay   = 0;
let currentClass = localStorage.getItem('ort_class') || 'ט1';

function todayIndex() {
  const d = new Date().getDay();
  // getDay(): 0=Sunday,1=Monday,...,5=Friday,6=Saturday
  // Map to our tabs: 0=ראשון,1=שני,...,4=חמישי
  if (d === 0) return 0;
  if (d >= 1 && d <= 4) return d;
  return 0; // Fri/Sat → show Sunday
}

// ════════════════════════════════════════════
// CLOCK
// ════════════════════════════════════════════
function pad(n){ return String(n).padStart(2,'0'); }

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clock-date').textContent =
    `יום ${HEB_DAYS[now.getDay()]}, ${now.getDate()} ב${HEB_MONTHS[now.getMonth()]}`;
  refreshChip(now);
}

function toMins(s){ const[h,m]=s.split(':').map(Number); return h*60+m; }

// Use first lesson times for period chip
function refreshChip(now) {
  const chip = document.getElementById('period-chip');
  const mins = now.getHours()*60 + now.getMinutes();
  const dayData = SCHEDULE[0]; // use Sunday data for time reference
  const firstClass = Object.values(dayData)[0] || [];
  for (const lesson of firstClass) {
    const [start,end] = lesson.time.split('–').map(toMins);
    if (mins>=start && mins<end) { chip.textContent=`📚 שיעור עכשיו`; return; }
  }
  chip.textContent = '📋 לחץ לבחירת כיתה';
}

// ════════════════════════════════════════════
// DAY TABS
// ════════════════════════════════════════════
function renderDayTabs() {
  const today = todayIndex();
  const el    = document.getElementById('day-tabs');
  el.innerHTML = '';
  DAYS.forEach((name,i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i===currentDay?' active':'');
    const dot = i===today ? '<span class="today-dot"></span>' : '';
    const hasData = SCHEDULE[i] && Object.keys(SCHEDULE[i]).length > 0;
    btn.innerHTML = `${dot}${name}<span class="day-tab-sub">יום ${DAYS_SUB[i]}${hasData?'':' ●'}</span>`;
    if (!hasData) btn.title = 'אין נתונים ליום זה';
    btn.onclick = () => { currentDay=i; renderDayTabs(); renderLessons(); };
    el.appendChild(btn);
  });
}

// ════════════════════════════════════════════
// CLASS TABS
// ════════════════════════════════════════════
function renderClassTabs() {
  const el = document.getElementById('class-tabs');
  el.innerHTML = '';
  CLASSES.forEach(cls => {
    const btn = document.createElement('button');
    btn.className = 'class-btn' + (cls===currentClass?' active':'');
    btn.textContent = cls;
    btn.onclick = () => {
      currentClass = cls;
      localStorage.setItem('ort_class', cls);
      renderClassTabs();
      renderLessons();
    };
    el.appendChild(btn);
  });
}

// ════════════════════════════════════════════
// LESSON CARDS
// ════════════════════════════════════════════
function renderLessons() {
  const area = document.getElementById('lessons-area');
  area.innerHTML = '';

  const dayData = SCHEDULE[currentDay] || {};
  const lessons = dayData[currentClass];

  if (!lessons || lessons.length === 0) {
    area.innerHTML = `
      <div class="no-schedule">
        <div class="icon">📅</div>
        <div>אין מערכת שעות ליום ${DAYS[currentDay]} לכיתה ${currentClass}</div>
      </div>`;
    return;
  }

  lessons.forEach((lesson, idx) => {
    const card = document.createElement('div');
    card.className = 'lesson-card';
    card.style.animationDelay = `${idx*0.07}s`;

    // Stripe
    const stripe = document.createElement('div');
    stripe.className = 'lesson-stripe';

    // Time
    const [startStr, endStr] = lesson.time.split('–');
    const timeDiv = document.createElement('div');
    timeDiv.className = 'lesson-time';
    timeDiv.innerHTML = `<div class="tl">שעה</div><div class="tm">${startStr}<br>${endStr||''}</div>`;

    // Body
    const body = document.createElement('div');
    body.className = 'lesson-body';

    const subjDiv = document.createElement('div');
    subjDiv.className = 'lesson-subject';
    subjDiv.textContent = lesson.subject;
    body.appendChild(subjDiv);

    // Right: teacher boxes + assignment
    const right = document.createElement('div');
    right.className = 'lesson-right';

    lesson.teachers.forEach(t => {
      const teacherObj = findTeacher(t.teacher);
      const box = document.createElement('div');
      box.className = 'teacher-box';

      if (t.track) {
        const track = document.createElement('div');
        track.className = 'teacher-track';
        track.textContent = t.track;
        box.appendChild(track);
      }

      const nameEl = document.createElement('div');
      nameEl.className = 'teacher-name-lbl';
      nameEl.textContent = t.teacher ? `מורה: ${t.teacher}` : 'טרם נקבע';
      box.appendChild(nameEl);

      const btnRow = document.createElement('div');
      btnRow.className = 'btn-row';

      // Zoom/Meet button
      if (teacherObj && teacherObj.url) {
        const a = document.createElement('a');
        a.href = teacherObj.url; a.target='_blank'; a.rel='noopener';
        a.className = `lc-btn ${teacherObj.type}`;
        a.innerHTML = (teacherObj.type==='zoom') ? '📹 כניסה לזום' : '📱 כניסה למיט';
        btnRow.appendChild(a);
      } else {
        const span = document.createElement('span');
        span.className = 'lc-btn no-lnk';
        span.textContent = 'אין קישור';
        btnRow.appendChild(span);
      }

      box.appendChild(btnRow);
      right.appendChild(box);
    });

    // Assignment buttons (only for non-חינוך lessons)
    if (lesson.subject !== 'חינוך') {
      const assignBox = document.createElement('div');
      assignBox.className = 'teacher-box';
      assignBox.style.minWidth = '155px';
      const aLabel = document.createElement('div');
      aLabel.className = 'teacher-name-lbl';
      aLabel.textContent = '📋 מטלה מקוונת';
      assignBox.appendChild(aLabel);

      // Show topic if available
      if (lesson.topic) {
        const topicEl = document.createElement('div');
        topicEl.className = 'teacher-track';
        topicEl.textContent = lesson.topic;
        assignBox.appendChild(topicEl);
      }

      const aBtnRow = document.createElement('div');
      aBtnRow.className = 'btn-row';

      if (lesson.assignments) {
        lesson.assignments.forEach((item, i) => {
          // Support both old format (string) and new format ({url, label})
          const link  = (typeof item === 'string') ? item : item.url;
          const label = (typeof item === 'string') ? `מטלה ${i+1}` : item.label;
          const a = document.createElement('a');
          a.href=link; a.target='_blank'; a.rel='noopener';
          a.className = i===0 ? 'lc-btn task' : 'lc-btn task2';
          a.textContent = label;
          aBtnRow.appendChild(a);
        });
      } else if (lesson.assignment) {
        const a = document.createElement('a');
        a.href=lesson.assignment; a.target='_blank'; a.rel='noopener';
        a.className = 'lc-btn task';
        a.textContent = 'פתח מטלה';
        aBtnRow.appendChild(a);
      } else {
        const span = document.createElement('span');
        span.className = 'lc-btn no-task';
        span.textContent = 'אין מטלה';
        aBtnRow.appendChild(span);
      }

      assignBox.appendChild(aBtnRow);
      right.appendChild(assignBox);
    }

    body.appendChild(right);
    card.append(stripe, timeDiv, body);
    area.appendChild(card);
  });
}

// ════════════════════════════════════════════
// TEACHER DIRECTORY
// ════════════════════════════════════════════
function renderTeachers() {
  const el = document.getElementById('teacher-dir');
  el.innerHTML = '';
  TEACHERS.forEach(t => {
    const row = document.createElement('div');
    row.className = 't-row';
    const name = document.createElement('span');
    name.className='t-name'; name.textContent=t.name;
    row.appendChild(name);
    if (t.url) {
      const a = document.createElement('a');
      a.href=t.url; a.target='_blank'; a.rel='noopener';
      a.className=`t-link ${t.type}`;
      a.textContent=(t.type==='zoom')?'📹 זום':'📱 מיט';
      row.appendChild(a);
    } else {
      const s=document.createElement('span'); s.className='t-no-link'; s.textContent='אין קישור';
      row.appendChild(s);
    }
    el.appendChild(row);
  });
}

// ════════════════════════════════════════════
// TASKS
// ════════════════════════════════════════════
const TASKS_KEY = 'ort_tasks_v1';
function getTasks()     { try{return JSON.parse(localStorage.getItem(TASKS_KEY))||[];}catch{return[];} }
function saveTasks(arr) { localStorage.setItem(TASKS_KEY,JSON.stringify(arr)); }

function renderTasks() {
  const tasks=getTasks(), el=document.getElementById('tasks-list');
  el.innerHTML='';
  if (!tasks.length){ el.innerHTML='<p class="no-tasks">אין מטלות כרגע ✓</p>'; return; }
  tasks.forEach(task=>{
    const row=document.createElement('div'); row.className='task-row';
    const chk=document.createElement('div'); chk.className='task-chk'+(task.done?' on':'');
    chk.textContent=task.done?'✓':''; chk.onclick=()=>toggleTask(task.id);
    const txt=document.createElement('span'); txt.className='task-txt'+(task.done?' done':'');
    txt.textContent=task.text;
    const del=document.createElement('button'); del.className='task-x'; del.textContent='✕';
    del.onclick=()=>deleteTask(task.id);
    row.append(chk,txt,del); el.appendChild(row);
  });
}
function addTask(){
  const inp=document.getElementById('task-inp'), text=inp.value.trim();
  if(!text)return;
  const tasks=getTasks(); tasks.push({id:Date.now(),text,done:false});
  saveTasks(tasks); renderTasks(); inp.value=''; inp.focus();
}
function toggleTask(id){ const t=getTasks(), item=t.find(x=>x.id===id); if(item){item.done=!item.done;saveTasks(t);renderTasks();} }
function deleteTask(id){ saveTasks(getTasks().filter(x=>x.id!==id)); renderTasks(); }
document.getElementById('task-inp').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
function init() {
  currentDay = todayIndex();
  tick(); setInterval(tick, 1000);
  renderDayTabs();
  renderClassTabs();
  renderLessons();
  renderTeachers();
  renderTasks();
}
init();
</script>
